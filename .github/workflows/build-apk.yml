name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Add backup plugin
        run: |
          D=android/app/src/main/java/com/tripsplit/hisaab
          cp android-overrides/MainActivity.java $D/MainActivity.java
          cp android-overrides/FolderBackupPlugin.java $D/FolderBackupPlugin.java
          sed -i "0,/dependencies {/s//dependencies {\n    implementation 'androidx.documentfile:documentfile:1.0.1'/" android/app/build.gradle

      - name: Set app icon
        run: |
          test -f assets/icon-only.png || { echo "assets/icon-only.png nahi mila"; ls -R . | head -50; exit 1; }
          sudo apt-get update
          sudo apt-get install -y imagemagick
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            dir=android/app/src/main/res/mipmap-$n
            mkdir -p $dir
            convert assets/icon-only.png -resize ${s}x${s} $dir/ic_launcher.png
            cp $dir/ic_launcher.png $dir/ic_launcher_round.png
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

      - name: Apply custom AndroidManifest
        run: cp android-overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: trip-hisaab-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
