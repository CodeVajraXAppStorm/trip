<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ट्रिप हिसाब</title>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#1b2237;--muted:#6b7490;--line:#e6e9f2;--pri:#5b4bdb;--pri2:#8a5cf6;--ok:#12a36b;--bad:#e5484d;--chip:#eef0fa;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--card:#181c30;--text:#eef0fa;--muted:#9aa3c4;--line:#262b45;--chip:#222747;color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Hind',system-ui,sans-serif;font-size:16px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 90px}
.hero{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;margin:0 -16px 16px;padding:22px 20px 26px;border-radius:0 0 28px 28px}
.top{display:flex;align-items:center;gap:12px}
.ic{background:rgba(255,255,255,.2);color:#fff;width:42px;height:42px;padding:0;font-size:22px;border-radius:12px;flex:none}
.hero h1{margin:0;font-size:24px;font-weight:700}
.hero p{margin:6px 0 14px;opacity:.85;font-size:14px}
.stats{display:flex;gap:10px}
.stat{flex:1;background:rgba(255,255,255,.18);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:20px}.stat span{font-size:12px;opacity:.85}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(30,40,90,.05)}
h2{font-size:17px;margin:0 0 12px}
input,select{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
input:focus,select:focus{outline:2px solid var(--pri);border-color:transparent}
.row{display:flex;gap:8px}.row input{margin:0}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 16px;cursor:pointer;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
button.full{width:100%}button.ghost{background:var(--chip);color:var(--text)}
button.x{background:none;color:var(--muted);padding:4px 8px;font-size:18px}
button.red{background:var(--bad);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{background:var(--chip);color:var(--text);padding:8px 14px;border-radius:99px;font-size:14px;border:1.5px solid transparent;cursor:pointer;font-weight:500}
.chip.on{border-color:var(--pri);background:rgba(91,75,219,.14);color:var(--pri)}
.chip.p{display:inline-flex;align-items:center;gap:4px;cursor:default}
.item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);gap:8px}
.item:last-child{border:0}
.item small{color:var(--muted);display:block;font-size:13px}
.amt{font-weight:700;white-space:nowrap}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs button{flex:1;background:none;color:var(--muted);border-radius:12px;padding:8px;font-size:14px}
.tabs button.on{color:var(--pri);background:var(--chip)}
.pay{display:flex;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pay:last-child{border:0}
.pay .a{font-weight:600}.pay .arr{color:var(--muted)}
.pay .m{margin-left:auto;font-weight:700;color:var(--bad);font-size:18px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.empty{color:var(--muted);text-align:center;padding:18px 0}
.hide{display:none}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30}
.dr{position:fixed;top:0;bottom:0;left:0;width:86%;max-width:340px;background:var(--card);z-index:31;transform:translateX(-102%);transition:transform .25s;overflow-y:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px))}
.dr.open{transform:none}
.trip{cursor:pointer}
.live{color:var(--ok);font-size:12px;font-weight:700}
.det{position:fixed;inset:0;background:var(--bg);z-index:40;overflow-y:auto;padding:env(safe-area-inset-top,0px) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.bar{display:flex;align-items:center;gap:10px;padding:14px 0}
.tw{overflow-x:auto}
.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb th{color:var(--muted);text-align:left;font-weight:600;padding:8px 6px;border-bottom:1px solid var(--line)}
.tb td{padding:12px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tb tr:last-child td{border:0}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="top"><button class="ic" id="menu">☰</button><h1 id="title">🧳 ट्रिप हिसाब</h1></div>
    <p>सबका खर्चा, एक जगह — बराबर बँटवारा</p>
    <div class="stats"><div class="stat"><b id="sTotal">₹0</b><span>कुल खर्चा</span></div><div class="stat"><b id="sPeople">0</b><span>लोग</span></div><div class="stat"><b id="sExp">0</b><span>एंट्री</span></div></div>
  </div>

  <section id="v-people">
    <div class="card"><h2>👥 ट्रिप पर कौन-कौन गया?</h2>
      <div class="row"><input id="pn" placeholder="नाम लिखो (जैसे: राहुल)"><button id="addP">जोड़ो</button></div>
      <div class="chips" id="plist" style="margin-top:12px"></div>
    </div>
    <div class="card"><h2>✏️ ट्रिप का नाम</h2><input id="tn" placeholder="जैसे: मनाली ट्रिप 2026"></div>
    <button class="ghost full" id="reset">➕ नई ट्रिप शुरू करो (पुरानी सेव रहेगी)</button>
  </section>

  <section id="v-exp" class="hide">
    <div class="card"><h2>➕ नया खर्चा</h2>
      <input id="ed" placeholder="किस चीज़ का? (चाय, नाश्ता...)">
      <input id="ea" type="number" inputmode="decimal" placeholder="कुल रकम ₹ (जैसे 225)">
      <select id="ep"></select>
      <div style="font-size:14px;color:var(--muted);margin-bottom:8px">किन-किन के बीच बाँटना है? (टैप करो)</div>
      <div class="chips" id="esplit"></div>
      <button class="full" id="addE">खर्चा जोड़ो</button>
    </div>
    <div class="card"><h2>🧾 सारे खर्चे</h2><div id="elist"></div></div>
  </section>

  <section id="v-settle" class="hide">
    <button class="full" id="calc" style="margin-bottom:14px">🏁 ट्रिप खत्म — हिसाब करो</button>
    <div id="result"></div>
  </section>
</div>

<nav class="tabs">
  <button data-t="people" class="on">👥 लोग</button>
  <button data-t="exp">🧾 खर्चे</button>
  <button data-t="settle">💸 हिसाब</button>
</nav>

<div id="ov" class="ov hide"></div>
<aside id="dr" class="dr">
  <h2>📂 मेरी ट्रिप्स</h2>
  <button class="full" id="newT" style="margin-bottom:12px">➕ नई ट्रिप</button>
  <div id="tl"></div>
  <h2 style="margin-top:20px">☁️ बैकअप</h2>
  <div id="fs" style="font-size:14px;color:var(--muted);margin-bottom:10px"></div>
  <button class="ghost full" id="bPick" style="margin-bottom:8px">📁 फोल्डर चुनो / बदलो</button>
  <button class="ghost full" id="bNow" style="margin-bottom:8px">💾 अभी बैकअप करो</button>
  <button class="ghost full" id="bRes">♻️ फोल्डर से रिस्टोर करो</button>
  <button class="full" id="bTbl" style="margin-top:16px">📊 हिसाब तालिका देखो</button>
</aside>

<div id="det" class="det hide">
  <div class="bar"><button class="ghost" id="dBack">← वापस</button><h2 id="dT" style="margin:0"></h2></div>
  <div id="dB"></div>
</div>

<script>
function $(i){return document.getElementById(i)}
function ld(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function st(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function uid(){return 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function money(n){return '₹'+(Math.round(n*100)/100).toLocaleString('en-IN')}
function nm(T,id){var p=T.people.find(function(x){return x.id===id});return p?p.n:'?'}
function empty(T){return !T.people.length&&!T.exp.length&&!T.name}
function sig(T){return JSON.stringify([T.name,T.people,T.exp])}
function tot(T){return T.exp.reduce(function(a,e){return a+e.a},0)}
function upsert(T){var c=JSON.parse(JSON.stringify(T)),i=ALL.findIndex(function(x){return x.id===c.id});if(i>-1)ALL[i]=c;else ALL.push(c)}
function dt(u){try{return new Date(u).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}catch(e){return ''}}

var S=ld('tripHisaab',null)||{name:'',people:[],exp:[]};if(!S.id)S.id=uid();
var ALL=ld('tripHisaabAll',[]),split=[],folder=null,bt,lastJ=sig(S),dMode='';
if(!empty(S)&&!ALL.some(function(a){return a.id===S.id})){S.u=S.u||Date.now();upsert(S);st('tripHisaabAll',ALL)}

/* ---------- बैकअप फोल्डर ---------- */
function plug(){try{var C=window.Capacitor;if(C&&C.isNativePlatform&&C.isNativePlatform())return C.Plugins.FolderBackup||C.registerPlugin('FolderBackup')}catch(e){}return null}
function bkWrite(T){var p=plug();if(!p||!folder)return Promise.resolve();return p.writeFile({name:'trip-'+T.id+'.json',content:JSON.stringify(T)})}
function queueBk(T){clearTimeout(bt);bt=setTimeout(function(){bkWrite(T).catch(function(){})},600)}
function bkAll(){return Promise.all(ALL.map(bkWrite))}
function fsUpd(){$('fs').textContent=plug()?(folder?'✅ फोल्डर: '+folder.name+' — हर बदलाव अपने आप सेव होता है':'⚠️ अभी फोल्डर नहीं चुना'):'बैकअप सिर्फ Android ऐप में चलता है।'}
function merge(files){var n=0;files.forEach(function(f){try{var t=JSON.parse(f.content);if(!t.id||!Array.isArray(t.people)||!Array.isArray(t.exp))return;var i=ALL.findIndex(function(a){return a.id===t.id});if(i<0){ALL.push(t);n++}else if((t.u||0)>(ALL[i].u||0)){ALL[i]=t;n++}}catch(e){}});st('tripHisaabAll',ALL);return n}
function restore(){var p=plug();if(!p||!folder){alert('पहले फोल्डर चुनो');return Promise.resolve()}
  return p.readAll().then(function(r){var n=merge(r.files||[]);renderTl();alert(n?n+' ट्रिप रिस्टोर हो गईं ✅':'फोल्डर में कोई नई ट्रिप नहीं मिली')}).catch(function(e){alert('रिस्टोर नहीं हुआ: '+(e&&e.message||e))})}
function pick(){var p=plug();if(!p){alert('फोल्डर बैकअप सिर्फ Android ऐप में चलता है।');return Promise.resolve()}
  return p.pickFolder().then(function(r){folder=r;st('tripAsked',1);fsUpd();return p.readAll()}).then(function(r){
    var files=r.files||[];
    if(files.length&&confirm('इस फोल्डर में '+files.length+' ट्रिप फाइलें मिलीं। इन्हें ऐप में रिस्टोर करें?')){merge(files);renderTl()}
    return bkAll()}).catch(function(e){if(String(e&&e.message||e).indexOf('cancel')<0)alert('फोल्डर नहीं चुन पाए: '+(e&&e.message||e))})}
(function(){var p=plug();if(!p){fsUpd();return}
  p.getFolder().then(function(r){if(r&&r.uri)folder=r;fsUpd();
    if(!folder&&!ld('tripAsked',0)){st('tripAsked',1);setTimeout(function(){if(confirm('बैकअप के लिए एक फोल्डर चुनो, ताकि ऐप डिलीट होने पर भी तुम्हारी ट्रिप्स बची रहें। अभी चुनें?'))pick()},600)}
  }).catch(function(){fsUpd()})})();

/* ---------- सेव / रेंडर ---------- */
function save(){var j=sig(S);st('tripHisaab',S);if(j===lastJ)return;lastJ=j;S.u=Date.now();st('tripHisaab',S);if(!empty(S)){upsert(S);st('tripHisaabAll',ALL);queueBk(S)}}
function render(){
  $('sTotal').textContent=money(tot(S));$('sPeople').textContent=S.people.length;$('sExp').textContent=S.exp.length;
  $('title').textContent='🧳 '+(S.name||'ट्रिप हिसाब');$('tn').value=S.name||'';
  $('plist').innerHTML=S.people.length?S.people.map(function(p){return '<span class="chip p">'+esc(p.n)+'<button class="x" data-del="'+p.id+'">×</button></span>'}).join(''):'<div class="empty" style="width:100%">पहले सबके नाम जोड़ो</div>';
  $('ep').innerHTML=S.people.map(function(p){return '<option value="'+p.id+'">'+esc(p.n)+' ने पैसे दिए</option>'}).join('');
  split=split.filter(function(id){return S.people.some(function(p){return p.id===id})});
  drawSplit();
  $('elist').innerHTML=S.exp.length?S.exp.slice().reverse().map(function(e){return '<div class="item"><div>'+esc(e.d)+'<small>'+esc(nm(S,e.p))+' ने दिए · '+e.s.length+' लोगों में · '+money(e.a/e.s.length)+' प्रति व्यक्ति</small></div><div class="amt">'+money(e.a)+'<button class="x" data-xe="'+e.id+'">×</button></div></div>'}).join(''):'<div class="empty">अभी कोई खर्चा नहीं</div>';
  save();
}
function drawSplit(){
  $('esplit').innerHTML='<button class="chip ghost" data-all="1">सब</button>'+S.people.map(function(p){return '<button class="chip'+(split.indexOf(p.id)>-1?' on':'')+'" data-s="'+p.id+'">'+esc(p.n)+'</button>'}).join('');
}
function go(k){['people','exp','settle'].forEach(function(x){$('v-'+x).classList.toggle('hide',x!==k)});document.querySelectorAll('.tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.t===k)});window.scrollTo(0,0)}
function newTrip(){S={id:uid(),name:'',people:[],exp:[]};lastJ=sig(S);split=[];render();go('people')}

/* ---------- मेन्यू ---------- */
function renderTl(){
  var l=ALL.slice().sort(function(a,b){return (b.u||0)-(a.u||0)});
  $('tl').innerHTML=l.length?l.map(function(T){return '<div class="item trip" data-ot="'+T.id+'"><div><b>'+esc(T.name||'बिना नाम की ट्रिप')+'</b> '+(T.id===S.id?'<span class="live">● चालू</span>':'')+'<small>'+T.people.length+' लोग · '+money(tot(T))+' · '+dt(T.u)+'</small></div><span>›</span></div>'}).join(''):'<div class="empty">अभी कोई ट्रिप सेव नहीं है</div>';
}
function openDr(){renderTl();fsUpd();$('dr').classList.add('open');$('ov').classList.remove('hide')}
function closeDr(){$('dr').classList.remove('open');$('ov').classList.add('hide')}
$('menu').onclick=openDr;$('ov').onclick=closeDr;
$('newT').onclick=function(){closeDr();newTrip()};
$('bPick').onclick=pick;$('bRes').onclick=restore;
$('bNow').onclick=function(){if(!plug()||!folder){alert('पहले फोल्डर चुनो');return}bkAll().then(function(){alert('बैकअप हो गया ✅ ('+ALL.length+' ट्रिप)')}).catch(function(e){alert('बैकअप नहीं हुआ: '+(e&&e.message||e))})};
$('dBack').onclick=function(){if(dMode==='tbl2')openTbl();else $('det').classList.add('hide')};
$('bTbl').onclick=openTbl;
function openTbl(){
  closeDr();dMode='tbl';$('dT').textContent='📊 हिसाब तालिका';
  var l=ALL.slice().sort(function(a,b){return (b.u||0)-(a.u||0)});
  $('dB').innerHTML='<div class="card"><h2>कौन सी ट्रिप का हिसाब देखना है?</h2>'+(l.length?l.map(function(T){return '<div class="item trip" data-ot2="'+T.id+'"><div><b>'+esc(T.name||'बिना नाम की ट्रिप')+'</b><small>'+T.people.length+' लोग · '+money(tot(T))+' · '+dt(T.u)+'</small></div><span>›</span></div>'}).join(''):'<div class="empty">अभी कोई ट्रिप सेव नहीं है</div>')+'</div>';
  $('det').classList.remove('hide');$('det').scrollTop=0;
}
function showTbl(id){
  var T=ALL.find(function(x){return x.id===id});if(!T)return;
  dMode='tbl2';$('dT').textContent=T.name||'बिना नाम की ट्रिप';
  var R=calc(T),n=T.people.length,sh=T.people.map(function(p){return R.share[p.id]});
  var eq=n>0&&sh.every(function(v){return Math.abs(v-sh[0])<0.01});
  var h='<div class="card"><div class="item" style="border:0;padding:4px 0"><span>कुल खर्चा</span><span class="amt">'+money(R.total)+'</span></div>';
  if(eq)h+='<div class="item" style="border:0;padding:4px 0"><span>प्रति व्यक्ति हिस्सा</span><span class="amt">'+money(sh[0])+'</span></div>';
  h+='<div class="item" style="border:0;padding:4px 0"><span>सदस्य</span><span class="amt">'+n+'</span></div></div>';
  h+='<div class="card"><div class="tw"><table class="tb"><tr><th>सदस्य</th><th>शुरुआती भुगतान</th><th>कुल हिस्सा</th><th>हिसाब (निपटारा)</th></tr>';
  h+=T.people.map(function(p){
    var d=R.dues[p.id],r=R.recv[p.id],c='',rs=r.reduce(function(a,k){return a+k.v},0);
    if(r.length)c+='<b class="pos">'+money(rs)+' लेने हैं</b><small style="display:block;color:var(--muted)">'+r.map(function(k){return esc(nm(T,k.o))+' से '+money(k.v)}).join(', ')+'</small>';
    d.forEach(function(k){c+='<div class="neg">'+esc(nm(T,k.o))+' को <b>'+money(k.v)+'</b> देने हैं</div>'});
    if(!r.length&&!d.length)c='✓ बराबर';
    return '<tr><td><b>'+esc(p.n)+'</b></td><td>'+money(R.paid[p.id])+'</td><td>'+money(R.share[p.id])+'</td><td>'+c+'</td></tr>'}).join('');
  h+='</table></div></div>';
  $('dB').innerHTML=h;$('det').scrollTop=0;
}

function openTrip(id){
  var T=ALL.find(function(x){return x.id===id});if(!T)return;closeDr();dMode='';
  $('dT').textContent=T.name||'बिना नाम की ट्रिप';
  var h='<div class="card"><div class="item" style="border:0;padding:4px 0"><span>कुल खर्चा</span><span class="amt">'+money(tot(T))+'</span></div><div class="item" style="border:0;padding:4px 0"><span>लोग</span><span class="amt">'+T.people.length+'</span></div><div class="item" style="border:0;padding:4px 0"><span>तारीख</span><span class="amt">'+dt(T.u)+'</span></div></div><div class="dres"></div>';
  h+='<div class="card"><h2>🧾 किसने कितने दिए</h2>'+(T.exp.length?T.exp.map(function(e){return '<div class="item"><div>'+esc(e.d)+'<small>'+esc(nm(T,e.p))+' ने दिए · '+e.s.map(function(x){return esc(nm(T,x))}).join(', ')+' में बँटा</small></div><div class="amt">'+money(e.a)+'</div></div>'}).join(''):'<div class="empty">कोई खर्चा नहीं</div>')+'</div>';
  h+='<button class="full" id="dLoad" style="margin-bottom:10px">✏️ इस ट्रिप को चालू करो (एडिट)</button><button class="red full" id="dDel">🗑️ ट्रिप डिलीट करो</button>';
  $('dB').innerHTML=h;showRes(T,$('dB').querySelector('.dres'));
  $('dLoad').onclick=function(){S=JSON.parse(JSON.stringify(T));lastJ=sig(S);split=S.people.map(function(p){return p.id});$('det').classList.add('hide');render();go('exp')};
  $('dDel').onclick=function(){if(!confirm('यह ट्रिप हमेशा के लिए डिलीट होगी। पक्का?'))return;
    ALL=ALL.filter(function(x){return x.id!==id});st('tripHisaabAll',ALL);
    var p=plug();if(p&&folder)p.deleteFile({name:'trip-'+id+'.json'}).catch(function(){});
    if(S.id===id){newTrip()}$('det').classList.add('hide');renderTl()};
  $('det').classList.remove('hide');$('det').scrollTop=0;
}

/* ---------- लोग / खर्चे ---------- */
$('addP').onclick=function(){var v=$('pn').value.trim();if(!v)return;S.people.push({id:Date.now()+Math.random(),n:v});split=S.people.map(function(p){return p.id});$('pn').value='';render()};
$('pn').onkeydown=function(e){if(e.key==='Enter')$('addP').click()};
$('tn').oninput=function(){S.name=this.value;$('title').textContent='🧳 '+(S.name||'ट्रिप हिसाब');save()};
document.addEventListener('click',function(e){
  var t=e.target,it=t.closest?t.closest('[data-ot]'):null;
  var it2=t.closest?t.closest('[data-ot2]'):null;
  if(it2){showTbl(it2.dataset.ot2);return}
  if(it){openTrip(it.dataset.ot);return}
  if(t.dataset.del){var id=+t.dataset.del;if(S.exp.some(function(x){return x.p===id||x.s.indexOf(id)>-1})){alert('इस बंदे के खर्चे जुड़े हैं, पहले वो खर्चे हटाओ।');return}S.people=S.people.filter(function(p){return p.id!==id});render()}
  if(t.dataset.xe){S.exp=S.exp.filter(function(x){return x.id!==+t.dataset.xe});render()}
  if(t.dataset.s){var id2=+t.dataset.s,i=split.indexOf(id2);i>-1?split.splice(i,1):split.push(id2);drawSplit()}
  if(t.dataset.all){split=S.people.map(function(p){return p.id});drawSplit()}
  if(t.dataset.t)go(t.dataset.t);
});
$('addE').onclick=function(){
  var a=parseFloat($('ea').value),d=$('ed').value.trim()||'खर्चा';
  if(!(a>0)){alert('रकम सही डालो');return}
  if(!S.people.length){alert('पहले लोग जोड़ो');return}
  if(!split.length){alert('कम से कम एक बंदा चुनो');return}
  S.exp.push({id:Date.now(),d:d,a:a,p:+$('ep').value,s:split.slice()});
  $('ea').value='';$('ed').value='';render();
};
$('reset').onclick=function(){if(confirm('नई ट्रिप शुरू करें? पुरानी ट्रिप मेन्यू में सेव रहेगी।'))newTrip()};

/* ---------- हिसाब ---------- */
function calc(T){
  var bal={},paid={},share={},owe={},dues={},recv={},r2=function(n){return Math.round(n*100)/100};
  T.people.forEach(function(p){bal[p.id]=0;paid[p.id]=0;share[p.id]=0;owe[p.id]={};dues[p.id]=[];recv[p.id]=[]});
  T.exp.forEach(function(e){paid[e.p]+=e.a;bal[e.p]+=e.a;var x=e.a/e.s.length;e.s.forEach(function(id){share[id]+=x;bal[id]-=x;if(id!==e.p)owe[id][e.p]=(owe[id][e.p]||0)+x})});
  T.people.forEach(function(a){T.people.forEach(function(b){
    if(a.id>=b.id)return;
    var d=r2((owe[a.id][b.id]||0)-(owe[b.id][a.id]||0));
    if(d>0.01){dues[a.id].push({o:b.id,v:d});recv[b.id].push({o:a.id,v:d})}
    else if(d<-0.01){dues[b.id].push({o:a.id,v:-d});recv[a.id].push({o:b.id,v:-d})}
  })});
  var cr=[],db=[];
  T.people.forEach(function(p){var b=r2(bal[p.id]);if(b>0.01)cr.push({id:p.id,v:b});else if(b<-0.01)db.push({id:p.id,v:-b})});
  var tx=[],i=0,j=0;
  while(i<db.length&&j<cr.length){var m=Math.min(db[i].v,cr[j].v);tx.push({f:db[i].id,t:cr[j].id,v:m});db[i].v-=m;cr[j].v-=m;if(db[i].v<0.01)i++;if(cr[j].v<0.01)j++}
  return {paid:paid,share:share,dues:dues,recv:recv,tx:tx,total:tot(T)};
}
function showRes(T,box){
  var R=calc(T),fast=false;
  var h='<button class="ghost full fb" style="margin-bottom:14px">⚡ फास्ट पेमेंट (कम से कम ट्रांसफर)</button><div class="card pp"><h2>👤 हर बंदे को क्या करना है</h2>';
  h+=T.people.map(function(p){
    var d=R.dues[p.id],r=R.recv[p.id],x='<div style="padding:12px 0;border-bottom:1px solid var(--line)"><div style="font-weight:700;margin-bottom:6px">'+esc(p.n)+' <small style="font-weight:400;color:var(--muted)">(दिए '+money(R.paid[p.id])+' · हिस्सा '+money(R.share[p.id])+')</small></div>';
    d.forEach(function(k){x+='<div class="item" style="padding:6px 0;border:0"><span>➡️ <b>'+esc(nm(T,k.o))+'</b> को देने हैं</span><span class="amt neg">'+money(k.v)+'</span></div>'});
    r.forEach(function(k){x+='<div class="item" style="padding:6px 0;border:0"><span>⬅️ <b>'+esc(nm(T,k.o))+'</b> से मिलेंगे</span><span class="amt pos">'+money(k.v)+'</span></div>'});
    if(!d.length&&!r.length)x+='<div style="color:var(--muted)">✓ कुछ लेना-देना नहीं</div>';
    return x+'</div>'}).join('');
  h+='</div><div class="card hide ft"><h2>⚡ फास्ट पेमेंट</h2><div style="font-size:13px;color:var(--muted);margin-bottom:6px">सबका हिसाब जोड़कर सबसे कम ट्रांसफर में निपटारा</div>';
  h+=R.tx.length?R.tx.map(function(x){return '<div class="pay"><span class="a">'+esc(nm(T,x.f))+'</span><span class="arr">→ देगा →</span><span class="a">'+esc(nm(T,x.t))+'</span><span class="m">'+money(x.v)+'</span></div>'}).join(''):'<div class="empty">🎉 सब बराबर है!</div>';
  h+='</div><button class="full sh" style="margin-bottom:10px">📤 WhatsApp पर शेयर करो</button><button class="ghost full cp" style="margin-bottom:14px">📋 कॉपी करो</button>';
  box.innerHTML=h;
  var t0='🧳 '+(T.name||'ट्रिप हिसाब')+'\nकुल खर्चा: '+money(R.total)+'\n';
  T.people.forEach(function(p){
    var d=R.dues[p.id],r=R.recv[p.id];
    t0+='\n👤 '+p.n+' (दिए '+money(R.paid[p.id])+' · हिस्सा '+money(R.share[p.id])+'):';
    d.forEach(function(k){t0+='\n  ➡️ '+nm(T,k.o)+' को '+money(k.v)+' देने हैं'});
    r.forEach(function(k){t0+='\n  ⬅️ '+nm(T,k.o)+' से '+money(k.v)+' मिलेंगे'});
    if(!d.length&&!r.length)t0+='\n  ✓ कुछ लेना-देना नहीं';
  });
  var tF='⚡ '+(T.name||'ट्रिप हिसाब')+' — फास्ट पेमेंट\nकुल खर्चा: '+money(R.total)+'\n\n'+(R.tx.length?R.tx.map(function(x){return nm(T,x.f)+' → '+nm(T,x.t)+': '+money(x.v)}).join('\n'):'सब बराबर!');
  var q=function(c){return box.querySelector(c)};
  q('.fb').onclick=function(){fast=!fast;q('.pp').classList.toggle('hide',fast);q('.ft').classList.toggle('hide',!fast);this.textContent=fast?'👤 हर बंदे का हिसाब देखो':'⚡ फास्ट पेमेंट (कम से कम ट्रांसफर)'};
  q('.cp').onclick=function(){var txt=fast?tF:t0,b=this;try{navigator.clipboard.writeText(txt).then(function(){b.textContent='✅ कॉपी हो गया'})}catch(e){prompt('कॉपी करो:',txt)}};
  q('.sh').onclick=function(){
    var txt=fast?tF:t0,C=window.Capacitor,pl=C&&C.Plugins&&C.Plugins.Share;
    if(pl){pl.share({title:T.name||'ट्रिप हिसाब',text:txt,dialogTitle:'हिसाब शेयर करो'}).catch(function(){})}
    else if(navigator.share){navigator.share({title:T.name||'ट्रिप हिसाब',text:txt}).catch(function(){})}
    else{window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank')}
  };
}
$('calc').onclick=function(){showRes(S,$('result'))};
render();
</script>
